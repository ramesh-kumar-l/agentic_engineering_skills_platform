[project]
name = "project-intelligence"
version = "0.1.0"
description = "TestEnvironmentProfile derivation from a codebase-intelligence report (TEP Phase 3 — Project Intelligence extensions). Stdlib-only."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools]
packages = ["project_intelligence"]

[tool.setuptools.package-dir]
project_intelligence = "."

[tool.pytest.ini_options]
pythonpath = [".."]
testpaths = ["tests"]
