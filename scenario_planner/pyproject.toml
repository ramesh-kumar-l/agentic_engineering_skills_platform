[project]
name = "scenario-planner"
version = "0.1.0"
description = "Scenario Planner: turns Test Strategy Engine's flagged targets into candidate test scenarios grounded in regression-hunter's flag descriptions and codebase-intelligence's structural listing (TEP Phase 5b). Stdlib-only."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools]
packages = ["scenario_planner"]

[tool.setuptools.package-dir]
scenario_planner = "."

[tool.pytest.ini_options]
pythonpath = [".."]
testpaths = ["tests"]
