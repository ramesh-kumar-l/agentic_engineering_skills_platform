[project]
name = "release-readiness"
version = "0.1.0"
description = "Deterministic diff-hygiene/structural-blast-radius/test-coverage engine backing the Release Readiness skill. Composes on top of codebase-intelligence's report.json (required precondition, reusing ADR-010's pattern a sixth time), plus optional regression-hunter and security-context-guard report evidence (ADR-011 precedent)."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
