name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        skill:
          - acceptance-test-engineer
          - adversarial-diff-reviewer
          - architecture-decision
          - codebase-intelligence
          - dependency-supply-chain
          - feature-planner
          - refactoring-safety
          - regression-hunter
          - release-readiness
          - root-cause-analyzer
          - security-context-guard
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ${{ matrix.skill }}
        working-directory: skills/${{ matrix.skill }}
        run: pip install -e ".[dev]"

      - name: Run tests for ${{ matrix.skill }}
        working-directory: skills/${{ matrix.skill }}
        run: pytest -q
