[project]
name = "test-validation"
version = "0.1.0"
description = "Independent Validation: executes agent-authored test files against the target repo via subprocess and records real pass/fail evidence (TEP Phase 5c). Stdlib-only, requires pytest on PATH to execute Python test files."
requires-python = ">=3.10"
dependencies = ["pytest>=7.0"]

[tool.setuptools]
packages = ["test_validation"]

[tool.setuptools.package-dir]
test_validation = "."

[tool.pytest.ini_options]
pythonpath = [".."]
testpaths = ["tests"]
